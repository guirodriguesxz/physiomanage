spring:
  application:
    name: physiomanage

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:physiomanage}
    username: ${DB_USER:physiomanage}
    password: ${DB_PASSWORD:physiomanage}

  jpa:
    hibernate:
      ddl-auto: validate # schema é sempre gerenciado pelo Flyway, nunca pelo Hibernate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-in-production-min-256-bits-long-please}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24h
  cors:
    # Lista de origens permitidas, separadas por vírgula. Nunca usar "*"
    # aqui: com allowCredentials(true), origem coringa expõe respostas
    # autenticadas a qualquer site.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.physiomanage: ${LOG_LEVEL:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health
