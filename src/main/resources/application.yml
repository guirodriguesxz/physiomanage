spring:
  application:
    name: physiomanage

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:physiomanage}
    username: ${DB_USER:physiomanage}
    password: ${DB_PASSWORD:physiomanage}

  jpa:
    hibernate:
      ddl-auto: validate # schema é sempre gerenciado pelo Flyway, nunca pelo Hibernate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-in-production-min-256-bits-long-please}
    expiration-ms: ${JWT_EXPIRATION_MS:900000} # 15min — curto de propósito, renovação via refresh token
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 dias
  cors:
    # Lista de origens permitidas, separadas por vírgula. Nunca usar "*"
    # aqui: com allowCredentials(true), origem coringa expõe respostas
    # autenticadas a qualquer site.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  rate-limit:
    # Por IP, ver RateLimitFilter. Mitigação extra contra brute-force de
    # senha e spam de criação de tenant — não é a única defesa (senha já
    # é BCrypt), por isso os valores são generosos e não um lockout duro.
    login:
      max-attempts: ${RATE_LIMIT_LOGIN_MAX_ATTEMPTS:5}
      window-seconds: ${RATE_LIMIT_LOGIN_WINDOW_SECONDS:60}
    register-clinic:
      max-attempts: ${RATE_LIMIT_REGISTER_MAX_ATTEMPTS:3}
      window-seconds: ${RATE_LIMIT_REGISTER_WINDOW_SECONDS:60}
  cache:
    availability-ttl-seconds: ${AVAILABILITY_CACHE_TTL_SECONDS:300}
  availability:
    # Horário de funcionamento fixo da clínica (mesmo para todos os
    # profissionais) usado para gerar os slots de disponibilidade.
    # Simplificação: não modela dias fechados/feriados nem horário por
    # profissional.
    work-start-hour: ${AVAILABILITY_WORK_START_HOUR:8}
    work-end-hour: ${AVAILABILITY_WORK_END_HOUR:18}
    slot-minutes: ${AVAILABILITY_SLOT_MINUTES:50}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.physiomanage: ${LOG_LEVEL:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
